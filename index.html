{id:'dw',n:'Data Warehouse y OLAP',ic:'🗄️',th:`
<p>Un <b>Data Warehouse (DW)</b> es una base de datos centralizada diseñada <i>exclusivamente</i> para analizar y tomar decisiones, con datos estructurados de varias fuentes.</p>
<h4>4 propiedades (Inmon)</h4>
<ul><li><b>Orientado a temas:</b> organizado por áreas del negocio (ventas, clientes, inventario), no por procesos operativos.</li>
<li><b>Integrado:</b> consolida fuentes y armoniza inconsistencias (género M/F vs 1/0 → se estandariza).</li>
<li><b>Variante en el tiempo:</b> guarda historial de años para detectar tendencias (una BD normal guarda solo el estado actual).</li>
<li><b>No volátil:</b> solo lectura y carga; lo que entra no se modifica.</li></ul>
<h4>OLTP vs OLAP</h4>
<table><tr><th></th><th>OLTP</th><th>OLAP</th></tr>
<tr><td>Objetivo</td><td>Operación diaria (cobrar, registrar)</td><td>Análisis estratégico</td></tr>
<tr><td>Operaciones</td><td>Insertar/actualizar/borrar constantemente</td><td>Consultar y leer grandes volúmenes</td></tr>
<tr><td>Datos</td><td>Transacciones individuales en tiempo real</td><td>Agregados, resumidos e históricos</td></tr>
<tr><td>Ejemplo</td><td>Registrar compra en caja</td><td>Ventas totales por región último trimestre</td></tr></table>
<h4>Modelado multidimensional</h4>
<ul><li><b>Tabla de hechos:</b> centro; métricas numéricas (monto, cantidad, costo).</li>
<li><b>Tablas de dimensión:</b> rodean los hechos; contexto para filtrar/agrupar (tiempo, cliente, sucursal).</li>
<li><b>Esquema estrella:</b> hechos conectados directamente a dimensiones; simple y rápido.</li>
<li><b>Copo de nieve:</b> dimensiones normalizadas en subtablas; ahorra espacio pero consultas más complejas.</li></ul>
<h4>Cubo OLAP y operaciones</h4>
<ul><li><b>Roll-up:</b> sube en la jerarquía (Día→Mes→Año). <b>Drill-down:</b> baja (País→Ciudad→Tienda).</li>
<li><b>Slice:</b> fija UN valor de una dimensión (año = 2025) → corte 2D. <b>Dice:</b> rango en 2+ dimensiones → subcubo.</li>
<li><b>Pivot/Rotate:</b> gira los ejes (filas↔columnas).</li></ul>
<h4>Tipos de OLAP</h4>
<ul><li><b>ROLAP:</b> BD relacionales; grandes volúmenes, consultas más lentas.</li><li><b>MOLAP:</b> cubos dedicados, precalculados → ultra rápido.</li><li><b>HOLAP:</b> híbrido (resúmenes en cubo, detalle en relacional).</li></ul>
${A('Slice vs Dice y Roll-up vs Drill-down',`<b>Slice</b> = 1 valor, 1 dimensión (rebanada). <b>Dice</b> = rango/varios valores en 2+ dimensiones (dado/subcubo).<br><b>Roll-up</b> = resumir (menos detalle). <b>Drill-down</b> = desglosar (más detalle).<br>Truco: <i>Roll-up "enrolla" hacia arriba; Drill "perfora" hacia abajo.</i>`)}
${A('Hechos vs Dimensiones',`Hechos = números ("cuánto"). Dimensiones = contexto ("quién, cuándo, dónde"). Truco: la caja registradora es OLTP; el reporte del director es OLAP.`)}`,
fc:[['4 propiedades del DW (Inmon)','Orientado a temas · Integrado · Variante en el tiempo · No volátil'],['No volátil','Solo lectura y carga; no se modifica lo ya cargado'],['Variante en el tiempo','Guarda historial de años → tendencias'],['Integrado','Armoniza fuentes (M/F vs 1/0 → estándar)'],['OLTP','Caja registradora: operación diaria, insertar/actualizar'],['OLAP','Reporte del director: análisis estratégico, consultas sobre históricos'],['Tabla de hechos','Centro del esquema; métricas numéricas'],['Tabla de dimensión','Contexto: quién, cuándo, dónde'],['Esquema estrella vs copo de nieve','Estrella: dimensiones directas (rápido). Copo: dimensiones normalizadas (ahorra espacio, más joins)'],['Roll-up','Subir jerarquía: Día→Mes→Año'],['Drill-down','Bajar a detalle: País→Ciudad→Tienda'],['Slice','Un solo valor de una dimensión (año=2025)'],['Dice','Rango en 2+ dimensiones → subcubo'],['Pivot','Rotar ejes (filas↔columnas)'],['ROLAP / MOLAP / HOLAP','Relacional (lento, grande) / Cubo precalculado (rápido) / Híbrido']]},

{id:'crisp',n:'CRISP-DM',ic:'🔄',th:`
<p><b>CRoss-Industry Standard Process for Data Mining.</b> Nació (1996-2000) de un consorcio financiado por la Comisión Europea (proyecto ESPRIT: NCR, Daimler-Benz/Chrysler, SPSS, OHRA). Es neutral a industria y herramienta. En los 90 la minería de datos era más "arte" que disciplina.</p>
<p><b>SÍ ES:</b> modelo de proceso estructurado. <b>NO ES:</b> algoritmo, lenguaje, librería ni garantía de éxito.</p>
<h4>6 fases (ciclo, no cascada)</h4>
<table><tr><th>#</th><th>Fase</th><th>Clave de examen</th></tr>
<tr><td>1</td><td>Business Understanding</td><td>Primero "¿qué decisión apoyo?", nunca "¿qué algoritmo uso?". Objetivos, restricciones, criterios de éxito.</td></tr>
<tr><td>2</td><td>Data Understanding</td><td>Recolectar, explorar, calidad: faltantes, errores, atípicos.</td></tr>
<tr><td>3</td><td>Data Preparation</td><td>Limpiar/transformar. "Garbage in, garbage out". La que más tiempo consume.</td></tr>
<tr><td>4</td><td>Modeling</td><td>Aquí aparece el algoritmo y se ajustan parámetros.</td></tr>
<tr><td>5</td><td>Evaluation</td><td>¿Resuelve la necesidad del NEGOCIO? Evaluar modelo ≠ evaluar proyecto. Puede regresar a fases previas.</td></tr>
<tr><td>6</td><td>Deployment</td><td>Reportes o integración en software. Sin uso, sin impacto.</td></tr></table>
<h4>Trampa del 99.5% de Accuracy</h4>
<p>10,000 transacciones: 9,950 legítimas, 50 fraudes. Un modelo que dice "todo legítimo" tiene accuracy 99.5% pero Recall de fraude = 0%. Usar Precision, Recall, F1, PR-AUC.</p>
<h4>Caso DaimlerChrysler (1999)</h4>
<p>+7 millones de reclamaciones de garantía (~40 GB). Demostró que CRISP-DM <b>hace visibles las dificultades</b>: datos difíciles sin expertos (fase 2), preparación tomó mucho más (fase 3), patrones no útiles para ingenieros (fase 5).</p>
<h4>Limitaciones</h4><p>Sigue siendo estándar de facto, pero no cubre MLOps, monitoreo en producción, concept drift, gobernanza de IA ni privacidad.</p>
${A('Evaluar modelo vs evaluar proyecto',`Evaluar el <b>modelo</b> = métricas matemáticas (precision, recall). Evaluar el <b>proyecto</b> = ¿la decisión de negocio mejora? Un modelo con métricas altas puede ser inútil (ej. 99.5% accuracy sin detectar fraudes).`)}
${A('¿Por qué ciclo y no cascada?',`Porque la Evaluación (fase 5) puede mandarte de vuelta a cualquier fase anterior, incluso a redefinir el problema de negocio. Las flechas son bidireccionales.`)}`,
fc:[['CRISP-DM','CRoss-Industry Standard Process for Data Mining'],['Origen CRISP-DM','1996-2000, consorcio con fondos de la Comisión Europea (ESPRIT)'],['¿Es un algoritmo?','NO: es un modelo de proceso, neutral a industria y herramienta'],['6 fases','Negocio → Datos → Preparación → Modelado → Evaluación → Despliegue'],['Fase 1','Entender qué decisión apoyar (no el algoritmo)'],['Fase 3','Preparación: Garbage in, garbage out; la que más tiempo consume'],['Fase 4','Modeling: aquí se elige el algoritmo'],['Fase 5','Evaluación: ¿sirve al negocio? Puede regresar a fases previas'],['Fase 6','Despliegue: reporte o integración; sin uso no hay impacto'],['Trampa 99.5%','Accuracy alta con 0% Recall de fraude por desbalance'],['DaimlerChrysler','7M reclamos de garantía; hizo visibles las dificultades'],['Limitaciones actuales','No contempla MLOps, concept drift, gobernanza ni privacidad']]},

{id:'kdd',n:'KDD',ic:'⛏️',th:`
<p><b>Knowledge Discovery in Databases.</b> Proceso iterativo, <b>no trivial</b> y de varias etapas para identificar patrones <b>válidos, novedosos, útiles y comprensibles</b>. Flujo: datos en bruto → información/patrones → conocimiento para decidir.</p>
<table><tr><th>KDD</th><th>Data Mining</th></tr><tr><td>Proceso COMPLETO de 5 etapas (construir la casa entera)</td><td>Solo UNA etapa (la 4ª) donde se aplican algoritmos (levantar estructura)</td></tr></table>
<h4>5 etapas</h4>
<ol><li><b>Selección:</b> fuentes y variables relevantes. (SQL, NiFi, Talend)</li>
<li><b>Preprocesamiento:</b> limpieza: errores, duplicados, faltantes, formatos. (Pandas, NumPy, OpenRefine)</li>
<li><b>Transformación:</b> normalizar, reducir dimensiones (PCA), variables derivadas. (Scikit-learn, Spark)</li>
<li><b>Minería de datos:</b> clasificación (árboles, Bayes), clustering (K-Means), reglas de asociación (Apriori), series temporales. (Weka, RapidMiner, TensorFlow, PyTorch)</li>
<li><b>Interpretación y Evaluación:</b> validar patrones; métricas (Precisión, Recall, F1, AUC) + visualización. (Power BI, Tableau, Jupyter)</li></ol>
<h4>Trade-off legibilidad vs poder predictivo</h4>
<p>Árboles/reglas: alta legibilidad, menor poder predictivo. Redes neuronales: altísimo poder predictivo, "caja negra".</p>
<h4>Ventajas / Limitaciones / Ejemplo</h4>
<p>Ventajas: volúmenes masivos, patrones ocultos, decisiones basadas en evidencia. Limitaciones: dependencia de calidad de datos, consumo de tiempo (pre-proceso y transformación), patrones falsos por azar. Ejemplo: canasta de compra (pañales + cerveza los viernes).</p>
${A('¿Por qué "no trivial"?',`Porque los patrones no se obtienen con un cálculo directo (como un promedio): requieren algoritmos de búsqueda e inferencia.`)}
${A('Preprocesamiento vs Transformación',`Preprocesamiento = <b>limpiar</b> (corregir/eliminar). Transformación = <b>adaptar</b> (escalas, PCA, variables nuevas). Truco: primero lavas, luego cortas.`)}`,
fc:[['KDD','Knowledge Discovery in Databases: proceso completo de datos a conocimiento'],['Patrones en KDD deben ser…','Válidos, novedosos, útiles y comprensibles'],['KDD vs Data Mining','KDD = proceso de 5 etapas; Data Mining = solo la etapa 4'],['5 etapas KDD','Selección → Preprocesamiento → Transformación → Minería → Evaluación'],['Preprocesamiento','Limpieza: errores, duplicados, faltantes'],['Transformación','Normalizar, PCA, variables derivadas'],['Trade-off KDD','Árboles: legibles/menos precisos. Redes neuronales: precisas/caja negra'],['Ejemplo de aplicación','Canasta de compra: pañales + cerveza (reglas de asociación)'],['Limitación principal','Garbage in, garbage out; patrones falsos por azar']]},

{id:'ml',n:'Equipo 11: Algoritmos ML',ic:'🤖',th:`
<p>ML = el sistema <b>aprende patrones de los datos</b> (no usa reglas if/else escritas a mano) y mejora con la experiencia.</p>
<table><tr><th>Tarea</th><th>Pregunta</th><th>Etiquetas</th><th>Ejemplo</th></tr>
<tr><td>Regresión</td><td>¿Qué valor numérico?</td><td>Sí</td><td>Precio de casa</td></tr>
<tr><td>Clasificación</td><td>¿Qué categoría?</td><td>Sí</td><td>Spam / No spam</td></tr>
<tr><td>Clustering</td><td>¿Qué grupos existen?</td><td>No</td><td>Segmentar clientes</td></tr></table>
<ul><li><b>Regresión lineal:</b> ŷ = β₀ + β₁x; mínimos cuadrados (minimiza distancia puntos-recta).</li>
<li><b>Regresión logística:</b> CLASIFICACIÓN; función sigmoide → probabilidad 0–1; umbral (ej. 0.5).</li>
<li><b>Árbol de decisión:</b> preguntas sucesivas; fácil de interpretar; riesgo de sobreajuste.</li>
<li><b>Random Forest:</b> ensamble de muchos árboles, votación mayoritaria; reduce sobreajuste.</li>
<li><b>KNN:</b> clasifica por los K vecinos más cercanos (distancia); hay que escalar variables.</li>
<li><b>Naive Bayes:</b> probabilístico (Bayes), asume independencia entre variables; rápido en texto/categóricos.</li>
<li><b>K-Means:</b> no supervisado; K centroides, asigna al más cercano y recalcula hasta estabilizar.</li></ul>
${A('Regresión logística: ¿regresión o clasificación?',`Aunque se llama "regresión", <b>clasifica</b>: la sigmoide convierte el número en probabilidad y el umbral decide la clase.`)}
${A('K en KNN vs K en K-Means',`KNN: K = número de <b>vecinos</b> que votan (supervisado). K-Means: K = número de <b>grupos/centroides</b> (no supervisado).`)}`,
fc:[['Regresión','Predice un valor numérico continuo'],['Clasificación','Predice categoría discreta'],['Clustering','Encuentra grupos en datos sin etiquetas'],['Regresión lineal','ŷ = β₀ + β₁x; mínimos cuadrados'],['Regresión logística','Clasificación con sigmoide (0–1) y umbral'],['Árbol de decisión','Fácil de interpretar; riesgo de sobreajuste'],['Random Forest','Ensamble de árboles con voto mayoritario; reduce overfitting'],['KNN','K vecinos más cercanos; escalar variables'],['Naive Bayes','Bayes + independencia de variables; rápido con texto'],['K-Means','K centroides; asigna y recalcula iterativamente (sin etiquetas)']]},

{id:'e10',n:'Equipo 10: Métricas de Evaluación',ic:'📏',th:`
<h4>Matriz de confusión</h4>
<p><b>VP/TP</b>: dijo Sí y era Sí · <b>VN/TN</b>: dijo No y era No · <b>FP</b>: dijo Sí pero era No (falsa alarma) · <b>FN</b>: dijo No pero era Sí (se le pasó).</p>
<h4>Clasificación</h4>
<ul><li><b>Accuracy</b> = (TP+TN)/Total. Engañosa con clases desbalanceadas.</li>
<li><b>Precision</b> = TP/(TP+FP). Úsala cuando los <b>FP</b> son costosos (correo normal marcado como spam).</li>
<li><b>Recall/Sensibilidad</b> = TP/(TP+FN). Úsala cuando un <b>FN</b> es peligroso (enfermedad, fraude).</li>
<li><b>F1</b> = 2·P·R/(P+R): media armónica; ideal con datos desbalanceados.</li></ul>
<h4>Regresión</h4>
<ul><li><b>MAE:</b> promedio de |error|; misma unidad; fácil de interpretar.</li>
<li><b>MSE:</b> promedio de error²; castiga errores grandes; unidades al cuadrado.</li>
<li><b>RMSE:</b> √MSE; castiga grandes y vuelve a la unidad original.</li>
<li><b>R²:</b> % de variabilidad explicada (0–1); compara modelos sin importar unidades.</li></ul>
<h4>Clustering</h4>
<ul><li><b>Internas (Silueta):</b> sin etiquetas; cohesión (qué tan juntos dentro) y separación (qué tan lejos del grupo más cercano).</li>
<li><b>Externas (ARI):</b> con etiquetas reales; 1 = coincide perfecto, 0 = azar.</li></ul>
<h4>Ejemplo numérico extra</h4>
<p>TP=40, FP=10, FN=20, TN=30 (N=100): Accuracy=0.70; Precision=40/50=0.80; Recall=40/60=0.667; F1=0.727.<br>Regresión: reales 10,20,30; predichos 12,18,33 → errores 2,−2,3 → MAE=7/3=2.33; MSE=17/3=5.67; RMSE≈2.38.</p>
${A('FP vs FN en medicina (cómo no confundirte)',`Divide el nombre: la <b>2ª palabra</b> = lo que predijo el modelo (Positivo/Negativo); la <b>1ª</b> = si acertó (Verdadero/Falso).<br><b>FP</b>: predijo enfermo, estaba sano → falsa alarma (estudios extra, estrés).<br><b>FN</b>: predijo sano, estaba enfermo → falsa calma, el peligroso → se busca <b>Recall alto</b>.<br>Truco: <i>Precision penaliza FP (P de "Pánico falso"); Recall penaliza FN (R de "Rescatar a todos los enfermos")</i>.`)}
${A('MAE vs MSE vs RMSE',`Los tres miden magnitud del error. MAE trata todos los errores igual. MSE/RMSE elevan al cuadrado: un error de 10 pesa 100 vs 1 de peso 1. RMSE = √MSE para volver a las unidades. RMSE ≥ MAE siempre.`)}`,
fc:[['VP / TP','Dijo Sí y era Sí'],['VN / TN','Dijo No y era No'],['FP','Dijo Sí, era No: falsa alarma'],['FN','Dijo No, era Sí: se le pasó (peligroso)'],['Accuracy','(TP+TN)/Total; engaña con desbalance'],['Precision','TP/(TP+FP); importa si FP es costoso'],['Recall','TP/(TP+FN); importa si FN es peligroso'],['F1','2PR/(P+R): media armónica'],['MAE','Promedio de |error|; misma unidad'],['MSE','Promedio de error²; castiga errores grandes; unidades²'],['RMSE','√MSE; castiga grandes y vuelve a la unidad'],['R²','% de variabilidad explicada; compara modelos'],['Coeficiente de Silueta','Métrica interna: cohesión y separación de clusters'],['ARI','Métrica externa con etiquetas reales; 1 = perfecto, 0 = azar']]},

{id:'e9',n:'Equipo 9: Dashboards y Visualización',ic:'📊',th:`
<p>Un <b>Dashboard</b> es la interfaz visual de un <b>Sistema de Soporte a la Decisión (SSD)</b>.</p>
<ul><li><b>Dato:</b> unidad básica sin procesar. <b>Visualización:</b> representación gráfica (barras, pastel, líneas, mapa de calor). <b>Dashboard:</b> pantalla interactiva completa con varias visualizaciones, KPIs y filtros.</li>
<li><b>SSD =</b> Datos (fuentes limpias) + Modelos (reglas, estadística, ML/IA) + Dashboard. <b>La decisión final la toma el humano.</b></li></ul>
<h4>4 pasos para un buen dashboard</h4>
<ol><li>Definir el objetivo · 2. Conocer al usuario (directivo = resumen; analista = detalle) · 3. Organizar prioridades (lo crítico en zonas de vista rápida) · 4. Jerarquía visual (colores, tamaños, orden).</li></ol>
<h4>Componentes</h4>
<p><b>KPI</b> (Key Performance Indicator) · gráficos y mapas · <b>filtros</b> (fecha, región, categoría) · <b>drill-down</b> (clic para detalle) · <b>alertas</b> (valor supera límite o meta).</p>
<h4>IA en dashboards</h4>
<p>Tradicional: BD → análisis básico → dashboard → decisión. Con IA: modelos detectan patrones, generan predicciones y recomendaciones, y explican en lenguaje natural. <b>Riesgos:</b> confianza ciega, sesgos, perder el criterio humano.</p>
${A('Visualización vs Dashboard',`Una gráfica aislada = visualización. Un tablero que combina varias gráficas + KPIs + filtros + alertas = dashboard (como el HUD de un videojuego).`)}`,
fc:[['Dashboard','Interfaz visual de un SSD; pantalla interactiva con KPIs, gráficos y filtros'],['SSD (3 componentes)','Datos + Modelos + Dashboard'],['KPI','Key Performance Indicator'],['Visualización vs Dashboard','Gráfico individual vs pantalla completa que junta varios'],['4 pasos de diseño','Objetivo → Usuario → Prioridades → Jerarquía visual'],['Drill-down','Clic en dato general para ver detalle'],['Alertas','Aviso cuando un valor pasa un límite o meta'],['IA en dashboards','Detecta patrones, predice, recomienda y explica en lenguaje natural'],['Riesgo de IA en dashboards','Dependencia ciega, sesgo, perder criterio humano']]},

{id:'e8',n:'Equipo 8: Ética, Privacidad y Gobernanza',ic:'⚖️',th:`
<h4>Ética</h4>
<ul><li><b>Sesgo algorítmico:</b> el modelo aprende prejuicios de datos históricos y los perpetúa/amplifica.</li>
<li><b>Equidad (Fairness):</b> trato imparcial a grupos (raza, género, edad, nivel socioeconómico).</li>
<li><b>Explicabilidad (XAI):</b> entender y justificar por qué el modelo decidió (abrir "cajas negras").</li>
<li><b>Responsabilidad (Accountability):</b> quién responde legal y moralmente de las fallas.</li></ul>
<h4>Privacidad</h4>
<ul><li><b>Consentimiento informado:</b> saber qué, para qué, autorizar y poder revocar.</li>
<li><b>Anonimización:</b> IRREVERSIBLE; elimina identificadores directos e indirectos.</li>
<li><b>Seudonimización:</b> reemplaza por códigos; reversible con información adicional guardada aparte.</li>
<li><b>Privacidad diferencial:</b> añade ruido controlado para estadísticas globales sin revelar individuos.</li>
<li><b>GDPR (UE):</b> derecho al olvido y portabilidad. <b>LFPDPPP (México):</b> derechos <b>ARCO</b>: Acceso, Rectificación, Cancelación, Oposición.</li></ul>
<h4>Gobernanza</h4>
<ul><li><b>Calidad:</b> preciso, completo, consistente, actualizado.</li><li><b>Linaje (Data Lineage):</b> trayectoria del dato desde el origen con cada transformación hasta su uso; permite auditar dónde se corrompió.</li>
<li><b>RBAC:</b> permisos según rol.</li><li><b>Ciclo de vida:</b> creación, almacenamiento, uso, archivo, destrucción segura.</li></ul>
<table><tr><th>Pilar</th><th>Pregunta</th><th>Ejemplo</th></tr><tr><td>Ética</td><td>¿Es correcto?</td><td>Corregir sesgo por código postal</td></tr><tr><td>Privacidad</td><td>¿Protegemos la identidad?</td><td>Anonimizar historiales médicos</td></tr><tr><td>Gobernanza</td><td>¿Quién administra y asegura calidad?</td><td>Definir acceso y auditar calidad</td></tr></table>
${A('Anonimización vs Seudonimización',`Anonimizar = no hay vuelta atrás. Seudonimizar = hay una "llave" guardada aparte para revertir. Por eso los datos seudonimizados <b>siguen siendo datos personales</b> bajo el GDPR.`)}
${A('Privacidad vs Gobernanza',`Privacidad = derechos del titular y evitar divulgación. Gobernanza = control interno: calidad, linaje, roles de acceso.`)}`,
fc:[['Sesgo algorítmico','Error sistemático por prejuicios en datos de entrenamiento'],['Fairness','Trato imparcial entre grupos demográficos'],['XAI','Explicabilidad: justificar la decisión del modelo'],['Accountability','Quién responde legal y moralmente de fallas'],['Anonimización','Irreversible; sin reidentificación'],['Seudonimización','Códigos/claves; reversible con llave separada'],['Privacidad diferencial','Ruido controlado para estadísticas sin exponer individuos'],['GDPR','UE: derecho al olvido y portabilidad'],['LFPDPPP / ARCO','México: Acceso, Rectificación, Cancelación, Oposición'],['Linaje del dato','Rastrea origen y transformaciones; sirve para auditar'],['RBAC','Control de acceso basado en roles'],['3 pilares','Ética (¿correcto?) · Privacidad (¿protegido?) · Gobernanza (¿quién controla?)']]},

{id:'p0',n:'Profe 0: Razonamiento Aproximado',ic:'🌫️',th:`
<h4>Certeza, riesgo, incertidumbre</h4>
<ul><li><b>Certeza:</b> la acción lleva necesariamente a un resultado conocido (costos de 1,000 zapatos).</li>
<li><b>Riesgo:</b> se conocen opciones y probabilidades (llueve 40%, baja 25% la afluencia).</li>
<li><b>Incertidumbre:</b> no se conoce la probabilidad (¿subirá el dólar frente al euro?).</li></ul>
<h4>Fuentes de incertidumbre (3 grupos)</h4>
<p>Deficiencias de la información · Características del mundo real · Deficiencias del modelo. En medicina (Osler: "ciencia de la incertidumbre y arte de la probabilidad"): información incompleta, errónea, imprecisa; mundo real no determinista; modelo incompleto; modelo inexacto.</p>
<h4>Métodos</h4>
<ul><li><b>Cualitativos:</b> lógicas no monótonas (suposiciones que se corrigen): razonamiento por defecto (Reiter), TMS (Doyle), teoría de justificaciones (Cohen y Grinberg). Desventaja: no manejan grados de certeza.</li>
<li><b>Numéricos (razonamiento aproximado):</b> usan valores numéricos de creencia/probabilidad.</li></ul>
<h4>Historia</h4>
<p>S.XVIII Bayes y Laplace: probabilidad como creencia personal · Inicios S.XX Fisher: frecuencia a largo plazo · Años 30 Savage y de Finetti: creencia personal · IA inicial: Naive Bayes.</p>
<h4>Naive Bayes</h4>
<p>P(A|B) = P(B|A)·P(A) / P(B). Ejemplo seguros: p(sí|E)=0.0210, p(no|E)=0.0296 → se elige <b>no</b> (mayor). Inconvenientes: difícil obtener todas las probabilidades condicionales (estimaciones subjetivas) e independencia condicional poco verosímil.</p>
<h4>MYCIN, Redes Bayesianas, Lógica Difusa</h4>
<ul><li><b>MYCIN:</b> uno de los primeros sistemas expertos médicos (infecciones bacterianas, dosis de antibióticos según peso); usaba <b>factores de certeza</b>, criticado por falta de rigor probabilístico.</li>
<li><b>Redes Bayesianas:</b> inicios de los 80; modelo probabilista causal; nodo = variable, enlace = mecanismo causal.</li>
<li><b>Lógica difusa (Zadeh):</b> motiva la <b>vaguedad</b> (no la incertidumbre); pertenencia continua en [0,1]. Aplicaciones en Japón: control industrial, trenes, electrodomésticos, cámaras.</li></ul>
${A('Riesgo vs Incertidumbre',`Riesgo = conozco probabilidades. Incertidumbre = NO las conozco. Truco: <i>riesgo se puede calcular, incertidumbre se tiene que estimar.</i>`)}
${A('Vaguedad vs Incertidumbre (difusa)',`Incertidumbre: no sé si un hecho es cierto. Vaguedad: el concepto mismo es borroso ("pobre"). 500,000 pesetas ahorradas → pertenencia a "pobre" ≈ 0.4–0.5; 2 pesetas → 1; 1,500 millones → 0.`)}`,
fc:[['Certeza','Resultado conocido necesariamente'],['Riesgo','Se conocen opciones y probabilidades'],['Incertidumbre','No se conoce la probabilidad de ocurrencia'],['3 fuentes de incertidumbre','Información, mundo real, modelo'],['Métodos cualitativos','Lógicas no monótonas: Reiter, Doyle (TMS), Cohen y Grinberg'],['Métodos numéricos','Grados de creencia/probabilidad = razonamiento aproximado'],['Bayes y Laplace','S.XVIII: probabilidad como creencia personal'],['Fisher','Probabilidad como frecuencia a largo plazo'],['Inconvenientes de Naive Bayes','Probabilidades difíciles de obtener + independencia poco verosímil'],['MYCIN','Sistema experto médico con factores de certeza'],['Redes Bayesianas','Modelo causal: nodo=variable, enlace=causa; años 80'],['Lógica difusa','Zadeh; vaguedad; pertenencia en [0,1]']]},

{id:'p3',n:'Profe 3: Función de Densidad',ic:'🔔',th:`
<ul><li><b>Media</b> x̄ = (1/N)·Σxᵢ · <b>Moda:</b> dato más frecuente.</li>
<li><b>Mediana:</b> N impar → posición (N+1)/2; N par → promedio de los dos centrales ½(x<sub>N/2</sub>+x<sub>N/2+1</sub>) (datos ordenados).</li>
<li><b>Desviación respecto a la media</b> Dᵢ = |xᵢ − x̄| · <b>Desviación media</b> Dm = (1/N)Σ|xᵢ − x̄|.</li>
<li><b>Varianza</b> σ² = (1/N)Σ(xᵢ − x̄)² · <b>Desv. estándar</b> σ = √σ².</li></ul>
<h4>Ejemplo: alturas de perros (mm) 600, 470, 170, 430, 300 (N=5)</h4>
<p>x̄ = 1970/5 = 394 · diferencias: 206, 76, −224, 36, −94 · σ² = 108,520/5 = 21,704 · σ = √21,704 ≈ 147 · rango normal x̄ ± σ = <b>247 a 541 mm</b>.</p>
<h4>Campana de Gauss</h4>
<p>μ±1σ → 68.26% · μ±2σ → 95.44% · μ±3σ → 99.72%.</p>
<h4>Función de densidad (FDP)</h4>
<p>P(a ≤ X ≤ b) = ∫ₐᵇ p(x)dx = <b>área bajo la curva</b>. Con 100→1,000→10,000→100,000 observaciones el histograma se vuelve curva continua que representa a toda la población.<br>Normal: y = 1/(σ√(2π)) · e<sup>−(x−μ)²/(2σ²)</sup>; π≈3.14159, e≈2.71828.</p>
<h4>Excel</h4>
<p>AVERAGE/PROMEDIO · STDEV.S/DESVEST.M (muestra) · STDEV.P/DESVEST.P (población) · NORM.DIST(x, media, desv, acumulado)/DISTR.NORM.N.</p>
<h4>Ejemplo extra</h4><p>Datos 2,4,4,4,5,5,7,9 (N=8): media 5; moda 4; mediana (4+5)/2=4.5; Dm=12/8=1.5; σ²=32/8=4; σ=2; rango normal 3 a 7.</p>
${A('Área bajo la curva (integral)',`En una variable continua la probabilidad de un valor exacto es 0; solo tiene sentido P en un intervalo = área bajo p(x). <b>p(x) NO es una probabilidad</b> (puede ser >1); el área total = 1. Con "acumulado = VERDADERO" NORM.DIST da el área acumulada; con FALSO da la altura de la curva.`)}
${A('σ² vs σ y muestra vs población',`σ² está en unidades al cuadrado (mm²); σ regresa a mm. Esta guía divide entre <b>N</b> (población). Para muestra se divide entre N−1 (STDEV.S) — es el típico distractor.`)}`,
fc:[['Varianza σ²','Media de las diferencias a la media al cuadrado: (1/N)Σ(x−x̄)²'],['Desviación estándar σ','√σ²; qué tanto se alejan los datos'],['Mediana N impar','Posición (N+1)/2'],['Mediana N par','Promedio de los dos datos centrales'],['Moda','Dato más repetido'],['Desviación media','(1/N)Σ|x−x̄|'],['Regla 68-95-99.7','μ±1σ=68.26% · ±2σ=95.44% · ±3σ=99.72%'],['P(a≤X≤b)','Área bajo la curva de densidad entre a y b'],['Rango normal','x̄ ± σ'],['STDEV.S vs STDEV.P','Muestra (N−1) vs población (N)'],['NORM.DIST','Densidad (acumulado FALSO) o área acumulada (VERDADERO)'],['Perros: x̄, σ','394 mm; σ≈147 → normal 247–541 mm']]},

{id:'p6',n:'Profe 6: Naive Bayes + Laplace (Lepistos)',ic:'🪲',th:`
<p>10 ejemplos (COLOR, ALAS, TAMAÑO, VELOCIDAD → LEPISTO +/−):</p>
<table><tr><th></th><th>Color</th><th>Alas</th><th>Tam.</th><th>Vel.</th><th>Clase</th></tr>
<tr><td>E1</td><td>negro</td><td>sí</td><td>pequeño</td><td>alta</td><td>+</td></tr><tr><td>E2</td><td>amarillo</td><td>no</td><td>grande</td><td>media</td><td>−</td></tr><tr><td>E3</td><td>amarillo</td><td>no</td><td>grande</td><td>baja</td><td>−</td></tr><tr><td>E4</td><td>blanco</td><td>sí</td><td>medio</td><td>alta</td><td>+</td></tr><tr><td>E5</td><td>negro</td><td>no</td><td>medio</td><td>alta</td><td>−</td></tr><tr><td>E6</td><td>rojo</td><td>sí</td><td>pequeño</td><td>alta</td><td>+</td></tr><tr><td>E7</td><td>rojo</td><td>sí</td><td>pequeño</td><td>baja</td><td>−</td></tr><tr><td>E8</td><td>negro</td><td>no</td><td>medio</td><td>media</td><td>−</td></tr><tr><td>E9</td><td>negro</td><td>sí</td><td>pequeño</td><td>media</td><td>−</td></tr><tr><td>E10</td><td>amarillo</td><td>sí</td><td>grande</td><td>media</td><td>−</td></tr></table>
<p>A priori: P(+)=3/10, P(−)=7/10. Condicionales: P(blanco|+)=1/3; P(alta|+)=3/3; P(no alas|−)=4/7; P(grande|−)=3/7.</p>
<h4>Clasificar: amarillo, sin alas, pequeño, alta — SIN Laplace</h4>
<p>(+): 3/10·0/3·0/3·2/3·3/3 = <b>0</b> · (−): 7/10·3/7·4/7·2/7·1/7 = <b>0.007</b> → clase <b>−</b>.</p>
<h4>Laplace: P(A=v|C=c) = (n(A=v,C=c) + k) / (n(C=c) + k·|A|)</h4>
<p>k=1 usualmente; |A| = número de valores distintos del atributo: COLOR 4 · ALAS 2 · TAMAÑO 3 · VELOCIDAD 3.</p>
<p>(+) n=3: amarillo 1/7; no 1/5; pequeño 3/6; alta 4/6 → 0.3·(1/7)(1/5)(3/6)(4/6) = <b>0.002857</b><br>(−) n=7: amarillo 4/11; no 5/9; pequeño 3/10; alta 2/10 → 0.7·(4/11)(5/9)(3/10)(2/10) = <b>0.008485</b> → clase <b>−</b>.</p>
<h4>Más ejemplos para elegir la mejor probabilidad</h4>
<ul><li>negro, sí, pequeño, alta: sin Laplace (+)=0.0667 vs (−)=0.0052 → <b>+</b>; con Laplace (+)=0.0229 vs (−)=0.0068 → <b>+</b>.</li>
<li>rojo, sí, <b>grande</b>, alta: sin Laplace (+)=0 (grande|+=0/3), (−)=0.00262 → <b>−</b>; con Laplace (+)=0.00762 vs (−)=0.00453 → <b>+</b>. ¡Laplace cambió la decisión!</li>
<li>blanco, no, medio, baja: sin Laplace ambas 0 (empate inútil); con Laplace (+)=0.00095 vs (−)=0.00318 → <b>−</b>.</li></ul>
<p><b>Procedimiento:</b> 1) prior por clase 2) para cada atributo contar casos de la clase con ese valor 3) multiplicar 4) comparar y elegir el MAYOR (el denominador P(B) es común y no cambia la decisión).</p>
${A('Qué es k y |A| en Laplace',`<b>k</b> = ejemplos virtuales que se "agregan" por cada valor posible (normalmente 1). <b>|A|</b> = cardinalidad: cuántos valores distintos puede tomar ESE atributo (no cuántos aparecieron en la clase). El denominador suma k·|A| para que las probabilidades de todos los valores sigan sumando 1. Ojo: n(C=c) es el total de la clase (3 o 7), no 10. El prior P(C) NO se suaviza en esta guía.`)}
${A('Por qué hay que suavizar',`Un solo 0 anula toda la multiplicación (la clase queda con probabilidad 0 aunque los otros atributos coincidan) → sobreajuste a los datos vistos.`)}`,
fc:[['Teorema de Bayes','P(A|B) = P(B|A)·P(A) / P(B)'],['"Naive"','Asume independencia condicional de atributos'],['Prior Lepisto','P(+)=3/10, P(−)=7/10'],['Problema del cero','Un P=0 anula todo el producto → sobreajuste'],['Laplace','(n(A=v,C=c)+k)/(n(C=c)+k·|A|)'],['k','Ejemplos virtuales; usualmente k=1'],['|A|','Número de valores posibles del atributo (color 4, alas 2, tamaño 3, velocidad 3)'],['Lepisto amarillo/no/pequeño/alta sin Laplace','(+)=0, (−)=0.007 → clase −'],['Lepisto mismo caso con Laplace','(+)=0.002857, (−)=0.008485 → clase −'],['Regla de decisión','Elegir la clase con mayor probabilidad a posteriori (producto mayor)']]},

{id:'p7',n:'Profe 7: Matriz de Confusión (COVID)',ic:'🦠',th:`
<h4>Cómo identificar cada celda (truco)</h4>
<p>Dos palabras: la <b>2ª</b> = lo que PREDIJO el modelo (Positivo = C, Negativo = nc); la <b>1ª</b> = si ACERTÓ (Verdadero) o FALLÓ (Falso).</p>
<table><tr><th>Predicción / Real</th><th>Real C</th><th>Real nc</th></tr><tr><td>Predicción C</td><td>TP</td><td>FP</td></tr><tr><td>Predicción nc</td><td>FN</td><td>TN</td></tr></table>
<ul><li><b>TP:</b> Pred C, Real C — "atinó al decir Sí".</li><li><b>FP:</b> Pred C, Real nc — "falsa alarma".</li><li><b>FN:</b> Pred nc, Real C — "falsa calma/peligro".</li><li><b>TN:</b> Pred nc, Real nc — "atinó al decir No".</li></ul>
<h4>12 pacientes (Pred/Real)</h4>
<p>1 C/C TP · 2 C/nc FP · 3 nc/nc TN · 4 C/C TP · 5 C/C TP · 6 nc/nc TN · 7 nc/nc TN · 8 C/nc FP · 9 C/C TP · 10 C/C TP · 11 nc/nc TN · 12 nc/C FN</p>
<p><b>TP=5, FP=2, FN=1, TN=4, N=12.</b></p>
<ul><li>Accuracy = (5+4)/12 = <b>0.75</b></li><li>Precision = 5/(5+2) = 5/7 ≈ <b>0.71</b></li><li>Recall = 5/(5+1) = 5/6 ≈ <b>0.83</b></li><li>F1 = 2·(0.71·0.83)/(0.71+0.83) ≈ <b>0.77</b></li></ul>
<h4>Otros cálculos útiles</h4><p>Total de positivos reales = TP+FN = 6. Total predichos positivos = TP+FP = 7. Total predichos negativos = FN+TN = 5. Especificidad (extra) = TN/(TN+FP) = 4/6 ≈ 0.67.</p>
${A('Orientación de la matriz',`En esta guía las <b>filas = predicción</b> y las <b>columnas = real</b>. Librerías como scikit-learn lo ponen al revés (filas = real). Siempre lee los encabezados antes de ubicar FP y FN: están en la diagonal secundaria.`)}
${A('Qué métrica usar en COVID',`Un FN manda a casa a un enfermo contagioso: lo crítico → <b>Recall</b>. Un FP solo genera una prueba extra: se tolera más. Si el costo de FP fuera alto (cuarentena obligatoria injusta), importaría la <b>Precision</b>.`)}`,
fc:[['Regla para nombrar celdas','2ª palabra = lo predicho; 1ª = acertó o falló'],['TP en COVID','Pred C, Real C'],['FP en COVID','Pred C, Real nc (falsa alarma)'],['FN en COVID','Pred nc, Real C (falsa calma, peligroso)'],['TN en COVID','Pred nc, Real nc'],['Matriz del ejemplo','TP=5, FP=2, FN=1, TN=4 (N=12)'],['Accuracy ejemplo','(5+4)/12 = 0.75'],['Precision ejemplo','5/7 ≈ 0.71'],['Recall ejemplo','5/6 ≈ 0.83'],['F1 ejemplo','≈ 0.77'],['Especificidad','TN/(TN+FP) = 4/6']]}

function theory(id){const s=sec(id);$('#mn').innerHTML=`<h2 class="text-2xl font-bold mb-2">${s.ic} ${s.n}</h2>${tabs(id,0)}<article class="th bg-white dark:bg-slate-800 rounded-xl p-4 shadow">${s.th}</article><div class="mt-4 flex gap-2 flex-wrap"><button id="rd" class="${pri}">${st.read[id]?'✅ Leído (quitar)':'Marcar como leído'}</button><a href="#fc/${id}" class="${sec2}">Siguiente: Flashcards →</a></div>`;$('#rd').onclick=()=>{st.read[id]?delete st.read[id]:st.read[id]=1;save();theory(id);nav()}}
let deck=[],di=0;
function cards(id){const all=id==='all',s=all?null:sec(id);deck=all?S.flatMap(x=>x.fc.map(c=>[...c,x.id])):s.fc.map(c=>[...c,id]);di=0;drawCard(id)}
function drawCard(id){const c=deck[di],k=st.known[c[0]+c[2]];$('#mn').innerHTML=`<h2 class="text-2xl font-bold mb-2">🃏 Flashcards ${id==='all'?'(todas)':'– '+sec(id).n}</h2>${id!=='all'?tabs(id,1):''}<div class="text-sm mb-2">Tarjeta ${di+1} / ${deck.length} ${id==='all'?'· '+sec(c[2]).n:''} ${k?'· ✅ la sé':''}</div><div class="fc" id="fc"><div class="fci"><div class="fcf">${c[0]}</div><div class="fcb">${c[1]}</div></div></div><p class="text-xs text-center mt-1 text-slate-500">Toca la tarjeta para girarla</p><div class="mt-3 flex gap-2 flex-wrap justify-center"><button id="pv" class="${sec2}">←</button><button id="kn" class="${sec2}">${k?'Repasar otra vez':'✅ Ya la sé'}</button><button id="sf" class="${sec2}">🔀 Mezclar</button><button id="nx" class="${pri}">→</button></div>`;
 $('#fc').onclick=()=>$('#fc').classList.toggle('f');$('#pv').onclick=()=>{di=(di-1+deck.length)%deck.length;drawCard(id)};$('#nx').onclick=()=>{di=(di+1)%deck.length;drawCard(id)};$('#sf').onclick=()=>{deck=sh(deck);di=0;drawCard(id)};$('#kn').onclick=()=>{const key=c[0]+c[2];st.known[key]?delete st.known[key]:st.known[key]=1;save();drawCard(id)}}
function examCfg(){const h=location.hash.split('/')[1]||pre||'all';pre='';$('#mn').innerHTML=`<h2 class="text-2xl font-bold mb-3">📝 Simulador de examen</h2><div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow space-y-3"><label class="block">Modo / Tema<select id="xs" class="w-full mt-1 p-2 rounded border dark:bg-slate-700 dark:border-slate-600"><option value="all">🎲 Examen GLOBAL (mezclado de todos los temas)</option>${S.map(s=>`<option value="${s.id}" ${h===s.id?'selected':''}>${s.ic} ${s.n} (${Q.filter(q=>q.s===s.id).length})</option>`).join('')}</select></label><label class="block">Número de preguntas<select id="xn" class="w-full mt-1 p-2 rounded border dark:bg-slate-700 dark:border-slate-600"><option value="10">10</option><option value="20">20</option><option value="40">40</option><option value="9999" selected>Todas</option></select></label><label class="block">Tipo<select id="xt" class="w-full mt-1 p-2 rounded border dark:bg-slate-700 dark:border-slate-600"><option value="">Opción múltiple + Verdadero/Falso</option><option value="mc">Solo opción múltiple</option><option value="tf">Solo Verdadero/Falso</option></select></label><button id="go" class="${pri}">Comenzar</button></div>${last&&last.wrong.length?`<button id="rw" class="${sec2} mt-3">🔁 Reintentar ${last.wrong.length} errores del último examen</button>`:''}`;
 $('#go').onclick=()=>{const s=$('#xs').value,t=$('#xt').value;let ids=Q.map((q,i)=>i).filter(i=>(s==='all'||Q[i].s===s)&&(!t||Q[i].t===t));start(sh(ids).slice(0,+$('#xn').value))};if($('#rw'))$('#rw').onclick=()=>start(sh(last.wrong))}
function start(ids){ex={l:ids.map(i=>{const q=Q[i];return{i,o:q.t==='tf'?[{t:'Verdadero',k:q.v},{t:'Falso',k:!q.v}]:sh(q.o.map((t,j)=>({t,k:j===0})))}}),p:0,a:[],t0:Date.now()};ask()}
function ask(){const e=ex.l[ex.p],q=Q[e.i],s=sec(q.s);$('#mn').innerHTML=`<div class="flex justify-between text-sm mb-2"><span>${s.ic} ${s.n}</span><span>Pregunta ${ex.p+1}/${ex.l.length} · ⏱ <b id="tm"></b></span></div><div class="h-1.5 rounded bg-slate-200 dark:bg-slate-700 mb-3"><div class="h-1.5 rounded bg-indigo-500" style="width:${ex.p/ex.l.length*100}%"></div></div><div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow"><div class="text-xs mb-1 text-indigo-600 dark:text-indigo-300">${q.t==='tf'?'VERDADERO / FALSO':'OPCIÓN MÚLTIPLE'}</div><p class="font-semibold mb-2">${q.q}</p>${e.o.map((o,j)=>`<button class="opt" data-j="${j}">${q.t==='tf'?'':'<b>'+'ABCD'[j]+')</b> '}${o.t}</button>`).join('')}<div id="fb"></div></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=e.o[j].k;ex.a.push({i:e.i,ok});if(ok){st.ok[e.i]=1;save()}document.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(e.o[k].k)x.classList.add('ok');else if(k===j)x.classList.add('bad')});const last2=ex.p===ex.l.length-1;$('#fb').innerHTML=`<div class="mt-3 p-3 rounded-lg ${ok?'bg-emerald-100 dark:bg-emerald-900':'bg-rose-100 dark:bg-rose-900'}"><b>${ok?'✅ ¡Correcto!':'❌ Incorrecto'}</b><p class="mt-1">${q.w}</p></div><button id="nx" class="${pri} mt-3">${last2?'Ver resultados':'Siguiente →'}</button>`;$('#nx').onclick=()=>{ex.p++;ex.p<ex.l.length?ask():result()};prog()});
 clearInterval(ex.iv);ex.iv=setInterval(()=>{const t=$('#tm');if(!t)return clearInterval(ex.iv);const d=(Date.now()-ex.t0)/1000|0;t.textContent=(d/60|0)+':'+String(d%60).padStart(2,'0')},500)}
function result(){clearInterval(ex.iv);const d=(Date.now()-ex.t0)/1000|0,n=ex.a.length,k=ex.a.filter(x=>x.ok).length,w=ex.a.filter(x=>!x.ok).map(x=>x.i);last={wrong:w};const by={};ex.a.forEach(x=>{const s=Q[x.i].s;by[s]=by[s]||[0,0];by[s][1]++;if(x.ok)by[s][0]++});const pc=Math.round(k/n*100);
 $('#mn').innerHTML=`<h2 class="text-2xl font-bold mb-3">Resultados</h2><div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow"><div class="text-5xl font-extrabold ${pc>=70?'text-emerald-500':'text-rose-500'}">${pc}%</div><p>${k} de ${n} correctas · Tiempo: ${d/60|0}m ${d%60}s · ${pc>=90?'¡Excelente! 🏆':pc>=70?'Bien, sigue repasando 👍':'Necesitas repasar 📚'}</p><h4 class="font-bold mt-4 mb-2">Rendimiento por tema</h4>${Object.entries(by).map(([s,[a,b]])=>`<div class="mb-2 text-sm"><div class="flex justify-between"><span>${sec(s).ic} ${sec(s).n}</span><span>${a}/${b}</span></div><div class="h-3 rounded bg-slate-200 dark:bg-slate-700"><div class="h-3 rounded ${a/b>=.7?'bg-emerald-500':'bg-rose-500'}" style="width:${a/b*100}%"></div></div></div>`).join('')}</div><div class="mt-3 flex gap-2 flex-wrap">${w.length?`<button id="rw" class="${pri}">🔁 Repasar solo mis ${w.length} errores</button>`:''}<a href="#exam" class="${sec2}">Nuevo examen</a></div>${w.length?`<h4 class="font-bold mt-4 mb-2">Preguntas falladas</h4>`+w.map(i=>`<div class="p-3 mb-2 rounded-lg bg-white dark:bg-slate-800 shadow text-sm"><b>${Q[i].q}</b><p class="mt-1 text-slate-600 dark:text-slate-300">${Q[i].w}</p></div>`).join(''):''}`;if($('#rw'))$('#rw').onclick=()=>start(sh(w));nav()}
let idx=null;function buildIdx(){idx=[];S.forEach(s=>{const d=document.createElement('div');d.innerHTML=s.th;d.querySelectorAll('li,p,tr,details').forEach(e=>{if(e.tagName!=='DETAILS'&&e.closest('details'))return;const t=e.textContent.trim().replace(/\s+/g,' ');if(t.length>3)idx.push({s:s.id,t,k:'📖',n:norm(t)})});s.fc.forEach(c=>idx.push({s:s.id,t:c[0]+' → '+c[1],k:'🃏',n:norm(c[0]+' '+c[1])}))})}
function search(t){if(!idx)buildIdx();$('#se').value=t;const n=norm(t.trim());if(!n)return home();const r=idx.filter(x=>x.n.includes(n)).slice(0,40),re=new RegExp('('+t.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
 $('#mn').innerHTML=`<h2 class="text-xl font-bold mb-3">Resultados para «${t}» (${r.length})</h2>`+(r.map(x=>`<a href="#s/${x.s}" class="block p-3 mb-2 rounded-lg bg-white dark:bg-slate-800 shadow text-sm"><span class="text-xs text-indigo-600 dark:text-indigo-300">${x.k} ${sec(x.s).n}</span><br>${(x.t.length>260?x.t.slice(0,260)+'…':x.t).replace(/</g,'&lt;').replace(re,'<mark>$1</mark>')}</a>`).join('')||'Sin resultados.')}
$('#se').oninput=e=>{const v=e.target.value;location.hash=v.trim()?'#q/'+encodeURIComponent(v):'#home'};
$('#th').onclick=()=>{st.dark=!st.dark;save();applyTheme()};$('#mb').onclick=()=>$('#nv').classList.toggle('hidden');
addEventListener('hashchange',route);route();
</script></body></html>
